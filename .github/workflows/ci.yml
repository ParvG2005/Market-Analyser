name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-assistant/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_assistant
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://market:market@localhost:5434/market_assistant
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-assistant/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: market-assistant/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  frontend-e2e:
    runs-on: ubuntu-latest
    # Run inside the pinned Playwright image the visual baselines were generated
    # in, so font/anti-aliasing rendering matches the snapshots exactly.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    defaults:
      run:
        working-directory: market-assistant/frontend
    # Dummy Supabase env so `npm run build` (the e2e webServer) can inline
    # import.meta.env.VITE_SUPABASE_* without the client throwing at load. Vite
    # exposes VITE_-prefixed process env at build; e2e specs mock all network,
    # so no real Supabase is contacted.
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: market-assistant/frontend/playwright-report/
          retention-days: 7
