name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: {}  # reused as the pre-deploy gate by deploy.yml

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-assistant/backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_assistant
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI is not prod: keep the ENV=test path so tooling steps that build
      # Settings outside pytest (e.g. `alembic upgrade head`) don't trip the
      # prod fail-fast config guard, which requires managed-DB + real secrets.
      ENV: test
      DATABASE_URL: postgresql+asyncpg://market:market@localhost:5434/market_assistant
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: alembic upgrade head
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-assistant/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: market-assistant/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
